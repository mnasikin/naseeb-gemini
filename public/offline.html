<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f8fb" />
    <title>Naseeb · Sedang offline</title>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        background: #f6f8fb;
        color: #0f172a;
        font: 1rem/1.55 system-ui, sans-serif;
      }
      main {
        box-sizing: border-box;
        width: min(24rem, calc(100% - 2rem));
        padding: 2rem;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        background: #fff;
      }
      h1 {
        margin: 0;
        font: 600 1.75rem/1.2 Georgia, serif;
      }
      p { margin: 0.75rem 0 1.5rem; color: #475569; }
      a {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        padding: 0 1rem;
        border-radius: 0.5rem;
        background: #1d4ed8;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Naseeb sedang offline</h1>
      <p>Hubungkan perangkat ke internet untuk masuk dan melanjutkan cerita.</p>
      <a href="/">Coba lagi</a>
    </main>
  </body>
</html>
